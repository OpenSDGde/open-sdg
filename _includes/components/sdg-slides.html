<div class="container">
  <h2 style="font-size: 32px; font-weight: 700; color: #444444; padding-top: 5rem">Nachhaltigkeitsstrategie</h2>
  <h4 style="font-size: 22px; color: #444444; margin-bottom: 20px">Die 17 Ziele für nachhaltige Entwicklung</h4>
  <br />

  <div class="custom-carousel" id="sdgSlides">
    {% for slide in site.sdg_slides %}
    <div class="slide {% if forloop.first %}active{% endif %}">
      <img src="{{ site.baseurl }}/assets/img/sdg_slides/{{ slide.image }}" alt="{{ slide.title }}" />
      <!-- Mobile Nav Icons (unter dem Bild) -->
      <div class="mobile-nav">
        <span class="nav-icon" id="prevIcon"><i class="fa fa-chevron-left"></i></span>
        <span class="nav-icon" id="nextIcon"><i class="fa fa-chevron-right"></i></span>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Desktop: Dots -->
  <div class="indicators container">
    {% for slide in site.sdg_slides %}
    <span class="dot {% if forloop.first %}active{% endif %}" data-index="{{ forloop.index0 }}"></span>
    {% endfor %}
  </div>
</div>

<style>
  .custom-carousel {
    position: relative;
    width: 100%;
    height: auto;
    max-width: 960px;
    margin: 0 auto;
    overflow: hidden;
    background-color: #f9f9f9;
    border-radius: 6px;
  }

  .slide {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 1rem 0;
    text-align: center;
  }

  .slide.active {
    display: flex;
  }

  .slide img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
    margin: 0 auto;
  }

  .indicators {
    margin-top: 1rem;
    text-align: center;
  }

  .dot {
    height: 10px;
    width: 10px;
    margin: 0 6px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .dot.active {
    background-color: #444;
  }

  /* Mobile-only navigation below image */
  .mobile-nav {
    display: none;
    justify-content: center;
    gap: 20px;
    margin-top: 1rem;
  }

  .nav-icon {
    font-size: 24px;
    background-color: #333;
    color: white;
    padding: 10px 14px;
    border-radius: 50%;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .indicators {
      display: none;
    }

    .mobile-nav {
      display: flex;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const slides = document.querySelectorAll('#sdgSlides .slide')
    const dots = document.querySelectorAll('.dot')
    const interval = 7000
    let current = 0
    let timer

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index)
        if (dots[i]) dots[i].classList.toggle('active', i === index)
      })
      current = index
    }

    function nextSlide() {
      showSlide((current + 1) % slides.length)
    }

    function prevSlide() {
      showSlide((current - 1 + slides.length) % slides.length)
    }

    function startTimer() {
      timer = setInterval(nextSlide, interval)
    }

    function resetTimer() {
      clearInterval(timer)
      startTimer()
    }

    // Dot navigation (Desktop)
    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        const index = parseInt(dot.getAttribute('data-index'))
        showSlide(index)
        resetTimer()
      })
    })

    // Mobile icon navigation
    document.addEventListener('click', function (e) {
      if (e.target.closest('#prevIcon')) {
        prevSlide()
        resetTimer()
      }
      if (e.target.closest('#nextIcon')) {
        nextSlide()
        resetTimer()
      }
    })

    startTimer()
  })
</script>
